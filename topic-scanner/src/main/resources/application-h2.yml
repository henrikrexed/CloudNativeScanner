spring:
  application:
    name: topic-scanner
  
  # H2 Database configuration for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console for debugging
  h2:
    console:
      enabled: true
      path: /h2-console

# Logging configuration
logging:
  level:
    root: INFO
    com.cncf.scanner: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"

# Application specific configuration
app:
  debug:
    enabled: true
    trace-requests: true
    trace-performance: true
    detailed-scan-logging: true
  
  scanning:
    rate-limit-delay-ms: 1000
    max-retries: 3
    timeout-seconds: 30
  
  sources:
    reddit:
      user-agent: "CloudNativeScanner/1.0"
      request-delay-ms: 1000
      max-posts-per-subreddit: 100
    stackoverflow:
      api-key: ""
      request-delay-ms: 1000
      max-questions-per-tag: 100

