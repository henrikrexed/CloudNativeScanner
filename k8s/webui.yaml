apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-config
  namespace: topic-scanner
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/topic_scanner
  SPRING_DATASOURCE_USERNAME: topic_scanner
---
apiVersion: v1
kind: Secret
metadata:
  name: webui-secret
  namespace: topic-scanner
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: dG9waWNfc2Nhbm5lcl9wYXNzd29yZA== # topic_scanner_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: topic-scanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
      - name: webui
        image: webui:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: webui-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: webui-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webui-secret
              key: SPRING_DATASOURCE_PASSWORD
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: topic-scanner
spec:
  selector:
    app: webui
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webui-ingress
  namespace: topic-scanner
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: topic-scanner.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webui
            port:
              number: 80


