apiVersion: v1
kind: ConfigMap
metadata:
  name: topic-scanner-config
  namespace: topic-scanner
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/topic_scanner
  SPRING_DATASOURCE_USERNAME: topic_scanner
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
  KAFKA_TOPIC_NAME: topic-scanner
---
apiVersion: v1
kind: Secret
metadata:
  name: topic-scanner-secret
  namespace: topic-scanner
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: dG9waWNfc2Nhbm5lcl9wYXNzd29yZA== # topic_scanner_password
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: topic-scanner
  namespace: topic-scanner
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: topic-scanner
            image: topic-scanner:1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topic-scanner-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
            - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
            - name: KAFKA_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: topic-scanner-config
                  key: KAFKA_TOPIC_NAME
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"


