apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pipeline-service
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
    {{- include "pipeline.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pipelineService.replicaCount }}
  selector:
    matchLabels:
      {{- include "pipeline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pipeline.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pipeline-service
          image: "{{ .Values.pipelineService.image.repository }}:{{ include "pipeline.imageTag" . }}"
          imagePullPolicy: {{ .Values.pipelineService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONAL-LOCATION
              value: /config/application.yaml
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "scanner.dbSecretName" . }}
                  key: password
            {{- if and .Values.llm.apiKey (not (eq .Values.llm.provider "ollama")) }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "scanner.llmSecretName" . }}
                  key: api-key
            {{- end }}
            {{- if and .Values.llm.fallback.enabled .Values.llm.fallback.apiKey }}
            - name: LLM_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "scanner.llmSecretName" . }}
                  key: fallback-api-key
            {{- end }}
            {{- if .Values.scanners.reddit.enabled }}
            - name: SCANNERS_REDDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-scanner-credentials
                  key: reddit-client-id
            - name: SCANNERS_REDDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-scanner-credentials
                  key: reddit-client-secret
            {{- end }}
            {{- if and .Values.scanners.youtube.enabled .Values.scanners.youtube.apiKey }}
            - name: SCANNERS_YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-scanner-credentials
                  key: youtube-api-key
            {{- end }}
            {{- range .Values.pipelineService.extraEnv }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.pipelineService.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pipeline-service
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
    {{- include "pipeline.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pipelineService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pipeline.selectorLabels" . | nindent 4 }}
