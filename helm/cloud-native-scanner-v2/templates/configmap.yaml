apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pipeline-config
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      datasource:
        url: "jdbc:postgresql://{{ include "scanner.dbHost" . }}:{{ include "scanner.dbPort" . }}/{{ include "scanner.dbName" . }}"
        username: {{ include "scanner.dbUser" . | quote }}
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false
      flyway:
        enabled: true
        baseline-on-migrate: true

    server:
      port: 8080

    # Pipeline
    topicscanner:
      scanner:
        plugins-dir: ${SCANNER_PLUGINS_DIR:plugins}
      pipeline:
        poll-interval-seconds: 30
        relevance-threshold: 0.7
        quality-threshold: 0.5
      llm:
        primary: {{ .Values.llm.provider | quote }}
        {{- if .Values.llm.fallback.enabled }}
        cloud-fallback: {{ .Values.llm.fallback.provider | quote }}
        {{- end }}
        ollama:
          url: {{ .Values.llm.ollama.url | quote }}
        {{- if and (ne .Values.llm.provider "ollama") .Values.llm.apiKey }}
        openai:
          api-key: ${OPENAI_API_KEY:}
        claude:
          api-key: ${ANTHROPIC_API_KEY:}
        {{- end }}

    # Actuator
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
      endpoint:
        health:
          show-details: when-authorized
