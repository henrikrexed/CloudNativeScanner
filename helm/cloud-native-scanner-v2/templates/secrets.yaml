{{- if not (include "scanner.dbSecretName" . | contains "existing") }}
{{- if or (and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret)) (and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  password: {{ .Values.postgresql.auth.password | default "" | b64enc | quote }}
  {{- else }}
  password: {{ .Values.externalDatabase.password | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- if and .Values.llm.fallback.enabled .Values.llm.fallback.apiKey }}
  fallback-api-key: {{ .Values.llm.fallback.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if or .Values.scanners.reddit.enabled (and .Values.scanners.youtube.enabled .Values.scanners.youtube.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-scanner-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.scanners.reddit.enabled }}
  reddit-client-id: {{ .Values.scanners.reddit.clientId | default "" | b64enc | quote }}
  reddit-client-secret: {{ .Values.scanners.reddit.clientSecret | default "" | b64enc | quote }}
  {{- end }}
  {{- if and .Values.scanners.youtube.enabled .Values.scanners.youtube.apiKey }}
  youtube-api-key: {{ .Values.scanners.youtube.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
