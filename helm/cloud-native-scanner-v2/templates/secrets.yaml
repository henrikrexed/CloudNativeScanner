{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.postgresql.auth.password | default "changeme" | b64enc | quote }}
{{- end }}
---
{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- if and .Values.llm.fallback.enabled .Values.llm.fallback.apiKey }}
  fallback-api-key: {{ .Values.llm.fallback.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.scanners.reddit.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-scanner-credentials
  labels:
    {{- include "scanner.labels" . | nindent 4 }}
type: Opaque
data:
  reddit-client-id: {{ .Values.scanners.reddit.clientId | b64enc | quote }}
  reddit-client-secret: {{ .Values.scanners.reddit.clientSecret | b64enc | quote }}
  {{- if .Values.scanners.youtube.enabled }}
  youtube-api-key: {{ .Values.scanners.youtube.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
