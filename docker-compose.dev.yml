version: '3.8'

services:
  # Infrastructure services
  postgresql:
    image: postgres:15-alpine
    container_name: topic-scanner-postgres
    environment:
      POSTGRES_DB: topic_scanner
      POSTGRES_USER: topic_scanner
      POSTGRES_PASSWORD: topic_scanner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topic_scanner -d topic_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: topic-scanner-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: topic-scanner-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Application services (for development)
  topic-scanner:
    build:
      context: .
      dockerfile: topic-scanner/Dockerfile
    container_name: topic-scanner-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/topic_scanner
      SPRING_DATASOURCE_USERNAME: topic_scanner
      SPRING_DATASOURCE_PASSWORD: topic_scanner_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      KAFKA_TOPIC_NAME: topic-scanner
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./topic-scanner/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  topic-analyzer:
    build:
      context: .
      dockerfile: topic-analyzer/Dockerfile
    container_name: topic-analyzer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/topic_scanner
      SPRING_DATASOURCE_USERNAME: topic_scanner
      SPRING_DATASOURCE_PASSWORD: topic_scanner_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: topic-processor
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      KAFKA_TOPIC_NAME: topic-scanner
      AI_ENABLED: "true"
      AI_SIMILARITY_THRESHOLD: "0.8"
      AI_DUPLICATE_DETECTION_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8081"
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./topic-analyzer/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: webui-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/topic_scanner
      SPRING_DATASOURCE_USERNAME: topic_scanner
      SPRING_DATASOURCE_PASSWORD: topic_scanner_password
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8082:8082"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./webui/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development tools
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: topic-scanner-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8083:8080"
    depends_on:
      - kafka

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: topic-scanner-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8084:80"
    depends_on:
      - postgresql

volumes:
  postgres_data:


